name: Test DB Migrations

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-migrations-from-scratch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: dudos_duda
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install migrate tool
        run: |
          wget https://github.com/golang-migrate/migrate/releases/download/v4.20.1/migrate.linux-amd64.deb
          sudo apt-get update && sudo apt-get install -y ./migrate.linux-amd64.deb
          migrate -version