openapi: 3.1.0
info:
  title: dudosapi
  version: 1.0.0
  description: |
    Ingests debate tournament data from Tabroom into Postgres and publishes the
    rendered pairings and school check-in pages to GCS.

    **Authentication** is enforced by Cloud Run IAM, not by this service: the
    deployed service rejects any request without a valid Google identity token
    (roles/run.invoker) with an HTML `403` from Google's front end, before it
    reaches the app. A local `go run` has no authentication at all. See
    CLAUDE.md for details.

    **Errors.** `400` responses carry a `text/plain` body. `500` responses carry
    a `text/plain` body only where noted, and are otherwise empty. A tournament
    id that is well-formed but has not been imported currently produces a `500`,
    not a `404`.

    **Times** are rendered in `America/Chicago`.
servers:
  - url: http://localhost:8080
    description: Local development (`PORT` overrides 8080). The deployed Cloud Run URL is intentionally not recorded in this public repository.
security:
  - cloudRunIdentityToken: []
tags:
  - name: tournaments
    description: Importing tournaments and reading back their pairings, check-ins and entry counts.
  - name: summary
    description: Counts across every imported tournament.

paths:
  /tournaments:
    get:
      tags: [tournaments]
      operationId: listTournaments
      summary: List Tabroom tournaments and whether each has been imported
      description: Fetches the tournament list live from Tabroom and marks the ones already imported into the database.
      responses:
        "200":
          description: Tournaments visible to the configured Tabroom account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
        "500":
          $ref: "#/components/responses/InternalErrorEmpty"

  /tournaments/{id}/import:
    post:
      tags: [tournaments]
      operationId: importTournament
      summary: Import (or re-import) a tournament from Tabroom and publish its pages
      description: |
        Downloads the tournament from Tabroom and rebuilds it in the database in a
        single transaction: the tournament's existing rows are deleted and
        everything is re-inserted, so anything removed in Tabroom is removed here
        too. If any step fails, the previous data is left intact.

        On success, re-renders and uploads `pairings.html` and `status.html` to
        the public `duda_pairings` bucket, replacing whichever tournament was
        published before. No request body.
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "201":
          description: Imported and published. Empty body.
        "400":
          $ref: "#/components/responses/InvalidTournamentId"
        "500":
          $ref: "#/components/responses/InternalErrorEmpty"

  /tournaments/{id}:
    delete:
      tags: [tournaments]
      operationId: deleteTournament
      summary: Delete an imported tournament and everything that belongs to it
      description: Cascades to the tournament's events, entries, rounds, judges, school check-ins and speaker awards. Deleting a tournament that was never imported also succeeds. Published GCS pages are not touched.
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "204":
          description: Deleted (or did not exist). Empty body.
        "400":
          $ref: "#/components/responses/InvalidTournamentId"
        "500":
          $ref: "#/components/responses/InternalErrorEmpty"

  /tournaments/{id}/pairings/latest:
    get:
      tags: [tournaments]
      operationId: getLatestPairings
      summary: Latest published round's pairings for each event
      description: For each event, only the highest-numbered published round is returned.
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          description: Pairings for the latest published round of each event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentPairings"
        "400":
          $ref: "#/components/responses/InvalidTournamentId"
        "500":
          description: Lookup failed, including an unknown tournament id.
          content:
            text/plain:
              schema:
                type: string
                example: unable to get latest pairings for tournament 40950

  /tournaments/{id}/schools/status:
    get:
      tags: [tournaments]
      operationId: getSchoolsStatus
      summary: School check-in (on-site) status
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          description: Every school registered for the tournament, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentSchoolsStatus"
        "400":
          $ref: "#/components/responses/InvalidTournamentId"
        "500":
          $ref: "#/components/responses/InternalErrorEmpty"

  /tournaments/{id}/events/schools:
    get:
      tags: [tournaments]
      operationId: getEventSchoolCounts
      summary: Active entry and student counts per school, by event
      description: |
        Counts only **active** entries; inactive entries are omitted entirely, as
        are events with no active entries and entries with no linked students.

        An entry whose students come from more than one school counts once for
        **each** of those schools, while an event's `entryCount` counts distinct
        entries - so an event's `entryCount` can be less than the sum of its
        schools' `entryCount`s.
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          description: Events ordered by name, each with its schools ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentEventSchoolCounts"
        "400":
          $ref: "#/components/responses/InvalidTournamentId"
        "500":
          $ref: "#/components/responses/InternalErrorEmpty"

  /summary:
    get:
      tags: [summary]
      operationId: getSummary
      summary: Counts across every imported tournament
      responses:
        "200":
          description: Global counts - not scoped to a single tournament.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "500":
          description: Lookup failed.
          content:
            text/plain:
              schema:
                type: string
                example: unable to get summary

components:
  securitySchemes:
    cloudRunIdentityToken:
      type: http
      scheme: bearer
      bearerFormat: Google-signed OIDC identity token
      description: Enforced by Cloud Run IAM at the edge, e.g. `gcloud auth print-identity-token`. Tokens expire after one hour.

  parameters:
    TournamentId:
      name: id
      in: path
      required: true
      description: Tabroom tournament id.
      schema:
        type: integer
        format: int32
        example: 40950

  responses:
    InvalidTournamentId:
      description: The `id` path segment is not an integer.
      content:
        text/plain:
          schema:
            type: string
            const: invalid tournament id
    InternalErrorEmpty:
      description: Server-side failure, including an unknown tournament id where applicable. Empty body; details are only in the server log.

  schemas:
    Tournament:
      type: object
      required: [id, date, name, loaded, updatedTime]
      properties:
        id:
          type: integer
          example: 40950
        date:
          type: string
          format: date
          example: "2026-09-26"
        name:
          type: string
          example: 2026 DUDA Middle School Fall Workshop
        loaded:
          type: boolean
          description: Whether the tournament has been imported into the database.
        updatedTime:
          type: string
          description: Tabroom's `backup_created` timestamp from the last import, as stored (UTC, not converted to Central). Empty string when `loaded` is false.
          example: "2026-09-26T13:18:09"

    TournamentPairings:
      type: object
      required: [name, updateTime, eventPairings]
      properties:
        name:
          type: string
        updateTime:
          $ref: "#/components/schemas/CentralDateTime"
        eventPairings:
          type: array
          description: One element per event that has a published round, ordered by event name. Empty when nothing is published.
          items:
            $ref: "#/components/schemas/EventPairing"

    EventPairing:
      type: object
      required: [name, number, flighted, startTime, pairings]
      properties:
        name:
          type: string
          example: Public Forum
        number:
          type: integer
          description: Round number.
          example: 1
        flighted:
          type: boolean
          description: True only when some pairing in the round has a flight number greater than 1.
        startTime:
          type: string
          description: Round start time in America/Chicago, Go `time.Kitchen` layout.
          example: "2:30PM"
        pairings:
          type: [array, "null"]
          description: Ordered by room name. `null` when the published round has no sections with ballots yet.
          items:
            $ref: "#/components/schemas/Pairing"

    Pairing:
      type: object
      required: [sectionId, flight, room, affEntry, affResult, negEntry, negResult, judges]
      properties:
        sectionId:
          type: integer
        flight:
          type: integer
          example: 1
        room:
          type: [string, "null"]
          description: "`null` when the section has no room assigned."
          example: "102"
        affEntry:
          description: "`null` when there is no entry on this side (e.g. a bye)."
          oneOf:
            - $ref: "#/components/schemas/Entry"
            - type: "null"
        affResult:
          $ref: "#/components/schemas/NullableBallotResult"
        negEntry:
          description: "`null` when there is no entry on this side (e.g. a bye)."
          oneOf:
            - $ref: "#/components/schemas/Entry"
            - type: "null"
        negResult:
          $ref: "#/components/schemas/NullableBallotResult"
        judges:
          type: [array, "null"]
          description: "`null` when no judge is assigned."
          items:
            $ref: "#/components/schemas/Judge"

    Entry:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The entry code.

    NullableBallotResult:
      description: The side's decided result; `null` until the section is decided.
      enum: [WIN, LOSS, BYE, FFT, null]

    Judge:
      type: object
      required: [id, personId, name, started]
      properties:
        id:
          type: integer
        personId:
          type: integer
        name:
          type: string
          description: '"First Last".'
        started:
          type: boolean
          description: Whether the judge has started their ballot.

    TournamentSchoolsStatus:
      type: object
      required: [name, updateTime, schoolsStatus]
      properties:
        name:
          type: string
        updateTime:
          $ref: "#/components/schemas/CentralDateTime"
        schoolsStatus:
          type: array
          items:
            $ref: "#/components/schemas/SchoolStatus"

    SchoolStatus:
      type: object
      required: [id, schoolName, checkedIn]
      properties:
        id:
          type: integer
          format: int32
        schoolName:
          type: string
        checkedIn:
          type: boolean
          description: Whether the school is marked on-site in Tabroom.

    TournamentEventSchoolCounts:
      type: object
      required: [name, events]
      properties:
        name:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventSchoolCounts"

    EventSchoolCounts:
      type: object
      required: [id, name, entryCount, studentCount, schools]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          example: Advanced Policy
        entryCount:
          type: integer
          format: int64
          description: Distinct active entries in the event.
        studentCount:
          type: integer
          format: int64
          description: Distinct students on those entries.
        schools:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SchoolEntryCount"

    SchoolEntryCount:
      type: object
      required: [id, name, entryCount, studentCount]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        entryCount:
          type: integer
          format: int64
          description: Active entries in this event with at least one student from this school.
        studentCount:
          type: integer
          format: int64
          description: This school's students on those entries.

    Summary:
      type: object
      required: [tournamentCount, roundCount]
      properties:
        tournamentCount:
          type: integer
          format: int64
          description: Tournaments imported, across the whole database.
        roundCount:
          type: integer
          format: int64
          description: Sections with at least one started ballot, across every imported tournament.

    CentralDateTime:
      type: string
      description: Tabroom's last-update time converted to America/Chicago, formatted `YYYY-MM-DD h:mmAM`.
      example: 2026-09-26 8:18AM
